  { id:'q19', section:'praktisch', nl:{q:'Bereid om 10 dagen intensieve training in Duitsland te volgen?'}, de:{q:'Bereit, 10 Tage intensive Schulung in Deutschland zu absolvieren?'},
    opts:[
      {nl:'Ja, absoluut',de:'Ja, absolut',w:2,o:2,s:2,f:3},
      {nl:'Ja, met enige planning',de:'Ja, mit etwas Planung',w:2,o:2,s:2,f:2},
      {nl:'Lastig vanwege familie/werk',de:'Schwierig wegen Familie/Arbeit',w:0,o:0,s:0,f:-1},
      {nl:'Nee',de:'Nein',w:0,o:0,s:0,f:-3,redFlag:true}
    ]},
  { id:'q20', section:'praktisch', nl:{q:'Heb je al onderzoek gedaan naar franchises of alternatieven?'}, de:{q:'Haben Sie bereits franchise-Optionen oder Alternativen recherchiert?'},
    opts:[
      {nl:'Ja, andere franchisees gesproken',de:'Ja, mit anderen Franchisees gesprochen',w:1,o:2,s:2,f:3},
      {nl:'Ja, alternatieven onderzocht',de:'Ja, Alternativen recherchiert',w:1,o:2,s:2,f:2},
      {nl:'Wat gelezen, nog geen gesprekken',de:'Etwas gelesen, noch keine Gespräche',w:1,o:1,s:1,f:1},
      {nl:'Dit is mijn eerste stap',de:'Das ist mein erster Schritt',w:0,o:0,s:1,f:0}
    ]}
];

let lang = 'nl';
let screen = 'intro';
let currentQ = 0;
let answers = {};
let contact = { firstName:'', lastName:'', email:'', phone:'', preference:'email', notes:'', privacy:false };
let resultData = null;

if (navigator.language && navigator.language.startsWith('de')) { lang = 'de'; }

// Check URL voor pre-fill (voor "samen invullen" mode via CRM)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('lang') === 'de') lang = 'de';
if (urlParams.get('lang') === 'nl') lang = 'nl';
const isCochat = urlParams.get('mode') === 'cochat';

function setLang(l) {
  lang = l;
  document.getElementById('rootHtml').setAttribute('lang', l);
  render();
}

function calculateResult() {
  let scores = { waxer:0, ondernemer:0, switcher:0, fit:0 };
  let redFlags = 0;
  let maxFit = 0;
  QUESTIONS.forEach(q => {
    const idx = answers[q.id];
    if (idx === undefined) return;
    const opt = q.opts[idx];
    scores.waxer += opt.w;
    scores.ondernemer += opt.o;
    scores.switcher += opt.s;
    scores.fit += opt.f;
    if (opt.redFlag) redFlags++;
    maxFit += 3;
  });
  let fitPct = Math.round(((scores.fit + maxFit) / (2 * maxFit)) * 100);
  if (redFlags >= 2) fitPct = Math.min(fitPct, 35);
  else if (redFlags >= 1) fitPct = Math.min(fitPct, 55);
  let tier;
  if (fitPct >= 80) tier = 'strong';
  else if (fitPct >= 65) tier = 'good';
  else if (fitPct >= 45) tier = 'moderate';
  else tier = 'low';
  const personas = [
    {id:'waxer', score:scores.waxer},
    {id:'ondernemer', score:scores.ondernemer},
    {id:'switcher', score:scores.switcher}
  ].sort((a,b) => b.score - a.score);
  return { scores, redFlags, fitPct, tier, bestPersona: personas[0].id, personaRanking: personas };
}

function render() {
  const el = document.getElementById('mainContainer');
  document.getElementById('langSelect').value = lang;
  const tr = T[lang];
  if (screen === 'intro') renderIntro(el, tr);
  else if (screen === 'question') renderQuestion(el, tr);
  else if (screen === 'contact') renderContact(el, tr);
  else if (screen === 'sending') renderSending(el, tr);
  else if (screen === 'result') renderResult(el, tr);
}

}

function renderQuestion(el, tr) {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  const progress = ((currentQ + 1) / (total + 1)) * 100;
  const selectedIdx = answers[q.id];
  const optsHtml = q.opts.map((opt, i) => `
    <div class="option-card border-2 border-gray-200 bg-white rounded-xl p-4 ${selectedIdx === i ? 'selected' : ''}" onclick="selectAnswer(${i})">
      <div class="flex items-center gap-3">
        <div class="w-5 h-5 rounded-full border-2 ${selectedIdx === i ? 'border-wax-500 bg-wax-500' : 'border-gray-300'} flex-shrink-0 flex items-center justify-center">
          ${selectedIdx === i ? '<div class="w-2 h-2 rounded-full bg-white"></div>' : ''}
        </div>
        <span class="text-gray-800">${opt[lang]}</span>
      </div>
    </div>`).join('');
  el.innerHTML = `
    <div class="fade-in">
      <div class="mb-8">
        <div class="flex items-center justify-between mb-2 text-sm">
          <span class="text-gray-500">${tr.progress_q} ${currentQ + 1} ${tr.progress_of} ${total}</span>
          <span class="text-wax-600 font-medium">${Math.round(progress)}%</span>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
          <div class="progress-bar h-full bg-gradient-to-r from-wax-400 to-wax-600" style="width:${progress}%"></div>
        </div>
      </div>
      <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-8 leading-tight">${q[lang].q}</h2>
      <div class="space-y-3 mb-8">${optsHtml}</div>
      <div class="flex justify-between">
        <button onclick="goBack()" class="text-gray-600 hover:text-gray-900 font-medium px-4 py-3 ${currentQ === 0 ? 'invisible' : ''}">${tr.btn_back}</button>
        <button onclick="goNext()" class="btn-primary font-semibold px-6 py-3 rounded-xl" ${selectedIdx === undefined ? 'disabled' : ''}>${tr.btn_next}</button>
      </div>
    </div>`;
}

function selectAnswer(idx) {
  const q = QUESTIONS[currentQ];
  answers[q.id] = idx;
  render();
}
function goBack() { if (currentQ > 0) { currentQ--; render(); } else { screen='intro'; render(); } }
function goNext() { if (currentQ < QUESTIONS.length - 1) { currentQ++; render(); } else { screen='contact'; render(); } }

        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">

        </div>

          <label class="block text-sm font-medium text-gray-700 mb-1.5">${tr.email} <span class="text-red-500">*</span></label>
          <input type="email" value="${contact.email}" oninput="contact.email=this.value" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-wax-500 focus:ring-2 focus:ring-wax-200 outline-none">

          <input type="tel" value="${contact.phone}" oninput="contact.phone=this.value" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-wax-500 focus:ring-2 focus:ring-wax-200 outline-none">
        </div>

          <label class="block text-sm font-medium text-gray-700 mb-2">${tr.contact_pref}</label>
          <div class="grid grid-cols-3 gap-2">
            ${['email','phone','whatsapp'].map(pref => `
              <label class="flex items-center justify-center gap-2 px-3 py-2 border rounded-lg cursor-pointer text-sm ${contact.preference===pref?'border-wax-500 bg-wax-50 text-wax-700':'border-gray-300 text-gray-700 hover:border-gray-400'}">

              </label>`).join('')}

          <textarea rows="3" oninput="contact.notes=this.value" placeholder="${tr.notes_ph}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:border-wax-500 focus:ring-2 focus:ring-wax-200 outline-none resize-none">${contact.notes}</textarea>

        <button onclick="screen='question'; currentQ=QUESTIONS.length-1; render()" class="text-gray-600 hover:text-gray-900 font-medium px-4 py-3">${tr.btn_back}</button>
        <button onclick="submitForm()" class="btn-primary font-semibold px-6 py-3 rounded-xl">${tr.btn_submit}</button>
      </div>

}

async function submitForm() {
  const tr = T[lang];
  const errEl = document.getElementById('contactError');
  errEl.classList.add('hidden');
  if (!contact.firstName.trim() || !contact.lastName.trim()) {
    errEl.textContent = tr.required + ': ' + tr.first_name + ' / ' + tr.last_name; errEl.classList.remove('hidden'); return;
  }
  if (!contact.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email)) {
    errEl.textContent = tr.invalid_email; errEl.classList.remove('hidden'); return;
  }
  if (!contact.privacy) {
    errEl.textContent = tr.required + ': privacy'; errEl.classList.remove('hidden'); return;
  }
  screen = 'sending'; render();
  const result = calculateResult();
  const payload = {
    lang, answers, contact, result,
    source: isCochat ? 'cochat' : 'public',
    userAgent: navigator.userAgent,
    submittedAt: new Date().toISOString()
  };
  try {
    const resp = await fetch('/api/public/persona-fit/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('submit failed');
    const data = await resp.json();
    resultData = { ...result, submissionId: data.id };
    screen = 'result'; render();
  } catch (e) {
    alert(tr.err_submit);
    screen = 'contact'; render();
  }
}

function renderSending(el, tr) {
  el.innerHTML = `
    <div class="text-center py-16">
      <div class="inline-block w-12 h-12 border-4 border-wax-200 border-t-wax-600 rounded-full animate-spin mb-6"></div>
      <p class="text-lg text-gray-600">${tr.sending}</p>
    </div>`;
}

function renderResult(el, tr) {
  const r = resultData;
  const persona = tr.personas[r.bestPersona];
  let title, sub, stepContact;
  if (r.tier === 'strong') { title = tr.result_strong_title; sub = tr.result_strong_sub; stepContact = tr.step_contact_strong; }
  else if (r.tier === 'good') { title = tr.result_good_title; sub = tr.result_good_sub; stepContact = tr.step_contact_good; }
  else if (r.tier === 'moderate') { title = tr.result_moderate_title; sub = tr.result_moderate_sub; stepContact = tr.step_contact_moderate; }
  else { title = tr.result_low_title; sub = tr.result_low_sub; stepContact = tr.step_contact_low; }
  const barColor = r.fitPct >= 80 ? 'from-green-400 to-green-600' : r.fitPct >= 65 ? 'from-wax-400 to-wax-600' : r.fitPct >= 45 ? 'from-yellow-400 to-yellow-600' : 'from-gray-400 to-gray-500';
  el.innerHTML = `
    <div class="fade-in">
      <div class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 rounded-2xl p-10 text-center text-white shadow-xl mb-6">
        <div class="brand-serif text-3xl md:text-4xl font-bold mb-3">${title}</div>
        <p class="text-gray-300 max-w-xl mx-auto leading-relaxed">${sub}</p>
      </div>
      ${r.tier !== 'low' ? `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 mb-6">
        <div class="text-sm font-semibold text-wax-700 uppercase tracking-wider mb-2">${tr.your_persona}</div>
        <h3 class="brand-serif text-2xl font-bold text-gray-900 mb-2">${persona.title}</h3>
        <p class="text-gray-600 leading-relaxed">${persona.desc}</p>
      </div>` : ''}
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 mb-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-semibold text-gray-600 uppercase tracking-wider">${tr.your_score}</div>
          <div class="text-3xl font-bold text-gray-900">${r.fitPct}<span class="text-lg text-gray-400">/100</span></div>
        </div>
        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r ${barColor}" style="width:${r.fitPct}%"></div>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 mb-6">
        <div class="text-sm font-semibold text-wax-700 uppercase tracking-wider mb-4">${tr.next_steps}</div>
        <ol class="space-y-3">
          <li class="flex items-start gap-3"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-wax-100 text-wax-700 text-xs font-bold flex items-center justify-center">1</span><span class="text-gray-700">${tr.step_email} <strong>${contact.email}</strong></span></li>
          <li class="flex items-start gap-3"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-wax-100 text-wax-700 text-xs font-bold flex items-center justify-center">2</span><span class="text-gray-700">${stepContact}</span></li>
          <li class="flex items-start gap-3"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-wax-100 text-wax-700 text-xs font-bold flex items-center justify-center">3</span><span class="text-gray-700">${tr.step_meanwhile}</span></li>
        </ol>
      </div>
    </div>`;
}

render();
</script>
